name: Tests & provenance guards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,cad]'
      - run: python -m pytest -q --durations=20
      - run: ruff check src tests scripts
      - run: vnai sources validate
      - run: vnai knowledge validate
      - name: Incomplete design brief example preserves planning gate
        run: |
          set +e
          vnai design brief validate examples/townhouse_4x20_brief.json
          result=$?
          test "$result" -eq 3
      - name: Build incomplete room program without layout
        run: |
          set +e
          vnai design program build examples/townhouse_4x20_brief.json > /tmp/design-program.json
          result=$?
          test "$result" -eq 3
      - run: vnai design zoning report examples/batch005/zoning-approved.json
      - run: vnai geometry report examples/batch005/geometry-linked-approved.json
      - run: vnai design floorplan generate examples/batch006a/alternatives.json --candidates 3 --out outputs/floorplan-v0.1.6.json
      - run: vnai design candidate review examples/batch006b/selected-only.json
      - run: vnai design openings validate examples/batch006b/corridor-clearance.json
      - run: vnai design circulation analyze examples/batch006b/corridor-graph-only.json
      - run: vnai design stairs validate examples/batch006b/stairs-connected.json
      - run: vnai design architectural-review examples/batch006b/corridor-clearance.json
      - run: vnai design replay validate examples/batch007a/replay/valid-provenance.json
      - run: vnai design replay report examples/batch007a/replay/valid-provenance.json --markdown outputs/replay-v0.1.9.md
      - run: vnai design revision compare examples/batch007a/revision/valid-manual-revision.json
      - run: vnai design readiness report examples/batch007a/readiness/room-geometry-ready.json --markdown outputs/readiness-v0.1.9.md
      - run: vnai design benchmark run examples/batch007a/benchmark/benchmark-a.json > outputs/benchmark-a-v0.1.9.json
      - run: vnai design walls generate examples/batch007b1/rectangle-inward.json > outputs/walls-v0.1.10.json
      - run: vnai design walls validate outputs/walls-v0.1.10.json
      - run: vnai design walls report examples/batch007b1/rectangle-inward.json --markdown outputs/walls-v0.1.10.md
      - run: vnai design walls preview examples/batch007b1/rectangle-inward.json --out outputs/walls-v0.1.10.svg
      - name: Townhouse wall conflicts remain visible
        run: |
          set +e
          vnai design walls preview examples/batch007b1/townhouse-benchmark.json --out outputs/townhouse-walls-v0.1.10.svg
          result=$?
          test "$result" -eq 4
      - run: vnai design openings draft examples/batch007b2/oracle-entrance.json > outputs/opening-draft-v0.1.11.json
      - run: vnai design openings drafting-validate outputs/opening-draft-v0.1.11.json
      - run: vnai design openings schedule examples/batch007b2/fixed-window.json --markdown outputs/opening-schedule-v0.1.11.md
      - run: vnai design openings preview examples/batch007b2/fixed-window.json --out outputs/openings-v0.1.11.svg
      - name: Townhouse opening source conflicts remain visible
        run: |
          set +e
          vnai design openings preview examples/batch007b2/townhouse-benchmark.json --out outputs/townhouse-openings-v0.1.11.svg
          result=$?
          test "$result" -eq 4
      - name: Proposed stair geometry, sections and incomplete gates
        run: |
          expect_stair_exit() {
            local expected="$1"
            shift
            set +e
            "$@"
            local result=$?
            set -e
            test "$result" -eq "$expected"
          }
          expect_stair_exit 3 vnai design stairs draft examples/batch007b3/straight.json > outputs/stair-draft-v0.1.12.json
          expect_stair_exit 3 vnai design stairs drafting-validate outputs/stair-draft-v0.1.12.json
          expect_stair_exit 3 vnai design stairs section examples/batch007b3/l-shaped.json
          expect_stair_exit 3 vnai design stairs schedule examples/batch007b3/u-shaped.json --markdown outputs/stair-schedule-v0.1.12.md
          expect_stair_exit 3 vnai design stairs preview examples/batch007b3/straight.json --view plan --out outputs/stair-plan-v0.1.12.svg
          expect_stair_exit 3 vnai design stairs preview examples/batch007b3/u-shaped.json --view section --out outputs/stair-section-v0.1.12.svg
          expect_stair_exit 4 vnai design stairs preview examples/batch007b3/townhouse-benchmark.json --view plan --out outputs/townhouse-stairs-v0.1.12.svg
      - name: Integrated two-storey townhouse refinement and actual previews
        run: |
          vnai design integrated refine examples/batch007b4/residential-4x20-six-rooms.json --out outputs/integrated-v0.1.13.json --markdown outputs/integrated-v0.1.13.md
          vnai design integrated validate outputs/integrated-v0.1.13.json
          vnai design integrated preview outputs/integrated-v0.1.13.json --view comparison --out outputs/integrated-comparison-v0.1.13.svg
          vnai design integrated preview outputs/integrated-v0.1.13.json --view after --floor F1 --out outputs/integrated-F1-v0.1.13.svg
          vnai design integrated preview outputs/integrated-v0.1.13.json --view after --floor F2 --out outputs/integrated-F2-v0.1.13.svg
          vnai design integrated preview outputs/integrated-v0.1.13.json --view section --out outputs/integrated-section-v0.1.13.svg
      - name: Architectural drafting, dimensions, layers and previews (Batch 007-C)
        run: |
          vnai design drafting generate examples/batch007c/townhouse-6rooms-drafting.json --out outputs/drafting-v0.1.14.json --markdown outputs/drafting-v0.1.14.md
          vnai design drafting validate outputs/drafting-v0.1.14.json
          vnai design drafting report outputs/drafting-v0.1.14.json --markdown outputs/drafting-report-v0.1.14.md
          vnai design drafting layers outputs/drafting-v0.1.14.json --markdown outputs/drafting-layers-v0.1.14.md
          vnai design drafting preview outputs/drafting-v0.1.14.json --floor F1 --out outputs/drafting-F1-v0.1.14.svg
          vnai design drafting preview outputs/drafting-v0.1.14.json --floor F2 --out outputs/drafting-F2-v0.1.14.svg
          vnai design drafting preview outputs/drafting-v0.1.14.json --view section --out outputs/drafting-section-v0.1.14.svg
          vnai design drafting preview outputs/drafting-v0.1.14.json --view sheet --out outputs/drafting-sheet-v0.1.14.svg
          vnai design drafting generate examples/batch007c/oracle-exterior-clear.json > outputs/oracle-a-v0.1.14.json
          vnai design drafting generate examples/batch007c/oracle-dimension-chain.json > outputs/oracle-b-v0.1.14.json
      - name: Fresh wheel outside checkout
        run: python scripts/smoke_wheel.py
      - run: vnai fengshui knowledge validate
      - run: vnai fengshui knowledge report --out outputs/fengshui_research_queue.json
      - run: vnai review examples/townhouse_sample.json --out outputs/check.json --markdown outputs/check.md
      - run: vnai dxf examples/townhouse_sample.json --out outputs/schematic.dxf
      - uses: actions/upload-artifact@v4
        with:
          name: demo-review-py${{ matrix.python-version }}
          path: outputs/
