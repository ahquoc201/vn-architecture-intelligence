name: Tests & provenance guards
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,cad]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts
      - run: vnai sources validate
      - run: vnai knowledge validate
      - name: Incomplete design brief example preserves planning gate
        run: |
          set +e
          vnai design brief validate examples/townhouse_4x20_brief.json
          result=$?
          test "$result" -eq 3
      - name: Build incomplete room program without layout
        run: |
          set +e
          vnai design program build examples/townhouse_4x20_brief.json > /tmp/design-program.json
          result=$?
          test "$result" -eq 3
      - run: vnai design zoning report examples/batch005/zoning-approved.json
      - run: vnai geometry report examples/batch005/geometry-linked-approved.json
      - run: vnai design floorplan generate examples/batch006a/alternatives.json --candidates 3 --out outputs/floorplan-v0.1.6.json
      - run: vnai design candidate review examples/batch006b/selected-only.json
      - run: vnai design openings validate examples/batch006b/corridor-clearance.json
      - run: vnai design circulation analyze examples/batch006b/corridor-graph-only.json
      - run: vnai design stairs validate examples/batch006b/stairs-connected.json
      - run: vnai design architectural-review examples/batch006b/corridor-clearance.json
      - run: vnai design replay validate examples/batch007a/replay/valid-provenance.json
      - run: vnai design replay report examples/batch007a/replay/valid-provenance.json --markdown outputs/replay-v0.1.9.md
      - run: vnai design revision compare examples/batch007a/revision/valid-manual-revision.json
      - run: vnai design readiness report examples/batch007a/readiness/room-geometry-ready.json --markdown outputs/readiness-v0.1.9.md
      - run: vnai design benchmark run examples/batch007a/benchmark/benchmark-a.json > outputs/benchmark-a-v0.1.9.json
      - run: vnai design walls generate examples/batch007b1/rectangle-inward.json > outputs/walls-v0.1.10.json
      - run: vnai design walls validate outputs/walls-v0.1.10.json
      - run: vnai design walls report examples/batch007b1/rectangle-inward.json --markdown outputs/walls-v0.1.10.md
      - run: vnai design walls preview examples/batch007b1/rectangle-inward.json --out outputs/walls-v0.1.10.svg
      - name: Townhouse wall conflicts remain visible
        run: |
          set +e
          vnai design walls preview examples/batch007b1/townhouse-benchmark.json --out outputs/townhouse-walls-v0.1.10.svg
          result=$?
          test "$result" -eq 4
      - name: Fresh wheel outside checkout
        run: python scripts/smoke_wheel.py
      - run: vnai fengshui knowledge validate
      - run: vnai fengshui knowledge report --out outputs/fengshui_research_queue.json
      - run: vnai review examples/townhouse_sample.json --out outputs/check.json --markdown outputs/check.md
      - run: vnai dxf examples/townhouse_sample.json --out outputs/schematic.dxf
      - uses: actions/upload-artifact@v4
        with:
          name: demo-review-py${{ matrix.python-version }}
          path: outputs/
