[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-architecture-intelligence"
version = "0.1.2"
description = "Source-grounded Vietnamese residential architecture knowledge and advisory tools for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "VN Architecture Intelligence contributors"}]
dependencies = ["PyYAML>=6.0,<7", "Shapely>=2.0,<3"]

[project.optional-dependencies]
cad = ["ezdxf>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.7"]

[project.scripts]
vnai = "vnai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
